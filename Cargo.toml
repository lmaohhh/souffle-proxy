[package]
name = "souffle_proxy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
http = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
h2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
fastrand = "2"
jiff = "0.2"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
mbrotli = "0.5.21"
socket2 = "0.6"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"

[features]
# Opt-in: treat HTTP 400 as a retryable upstream status. Some relays answer 400 for
# transient conditions (observed on jasper); the default build must NOT retry it,
# because a genuinely malformed request would be re-sent max_retry times.
retry-400 = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
